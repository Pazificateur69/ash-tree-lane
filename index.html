<section class="edition voice-editors" id="edition" data-title="A note on this edition">
  <h2 class="edition-title">A note on this edition</h2>
  <p>This is not the book. It is a retelling of one, in new words, by a reader who could not stop thinking about it.</p>
  <p>The book has several voices, and so does this. An old blind man writes the main text, a study of a film that does not exist; he speaks in Times. A tattoo apprentice who found his papers keeps interrupting him in Courier. The editors interrupt them both, in Bookman. At the back, a mother writes letters in Goudy.</p>
  <p>The small numbers open their notes. Notes open other notes. The rest is in the house: what you find there is added here, in the order you find it.</p>
</section>

<section class="intro voice-johnny" id="introduction" data-title="Introduction">
  <h2 class="intro-title">Introduction</h2>
  <p>Late one night Lude called me about a dead man.</p>
  <p>Not somebody he knew, exactly. An old guy in a building Lude knew, a man nobody had seen for a while and who had turned out to be dead in the way the old and alone get to be dead, which is quietly and for longer than anyone wants to think about. The landlord had shut the place up. Lude wanted to see inside. I worked in a tattoo shop, I had nothing better to do at one in the morning, so I went.</p>
  <p>His name was Zampanò. That was all I ever got, the one name, like a magician or a saint. He was about eighty. He had been blind since the fifties. The neighbors said women used to come by to read to him, a rotating crew of them over the years, and that he dictated to them too, for hours, in a voice that made you sit up straight.</p>
  <p>The apartment smelled like a closed box. Hardly any furniture. And in the middle of all that nothing, a trunk.</p>
  <p>Lude looked in, shrugged and went for a beer. I stayed.</p>
  <p>It was paper. Nothing but paper. Legal pads, napkins, the backs of envelopes, receipts, a strip of wallpaper, the inside of a cereal box, all of it covered in writing, some typed, some in his hand, some in the hands of the women who wrote for him. Footnotes on footnotes. Whole sections crossed out and then written again underneath. It was a book, or it wanted to be one: a long study of a film called <cite>The Navidson Record</cite>, about a family and their house.</p>
  <p>I went looking for the film. I’m telling you now so you don’t waste your time. It doesn’t exist. No distributor, no festival, no bootleg. The critics he quotes, when they exist at all, never wrote what he says they wrote. The whole thing is a house built on nothing, and he spent the end of his life measuring every room.</p>
  <p>So I took the trunk home and started putting the pages in order. That was the mistake, or the start of it.</p>
  <p>Here is what happened to me, and what will probably happen to you. One night you’ll be alone in a room you know by heart and you’ll feel the space behind you open up. Not a sound. Not a shape. Just the certainty that the room is a little bigger than it was a second ago. You’ll turn around and it will be fine. It will be exactly the same.</p>
  <p>That’s the part that gets you.</p>
  <p class="signature">Johnny Truant</p>
</section>

<section class="chapter" id="ch1" data-title="I. Ash Tree Lane">
  <h2 class="ch-head"><span class="ch-num">I</span><span class="ch-title">Ash Tree Lane</span></h2>
  <p><cite>The Navidson Record</cite> begins as the least remarkable film imaginable: a family moving house.</p>
  <p>Will Navidson had spent most of his adult life inside other people’s disasters. As a photojournalist he had gone to famines and wars, and one of his photographs had won him the Pulitzer Prize. By the time the film begins, he wants to stop. He buys a house on Ash Tree Lane, in the Virginia countryside, and moves there with Karen Green, a former model, and their two children, Chad and Daisy. Will and Karen are not married. Everyone who knew them agrees that they loved each other. Nearly everyone also agrees that love had not yet made either of them stay.</p>
  <p>Navidson’s plan is modest, even touching. He will document the ordinary. He mounts Hi8 cameras in the rooms and keeps a handheld with him, so that the house can record a family learning to live in it. What he wanted was a film about putting down roots.<sup><a class="ref" href="#n1">1</a></sup></p>
  <aside class="note" id="n1" data-voice="zampano" data-num="1">
    <p>On the house as a subject of documentary, and on the particular cruelty of filming one’s own family, see Rennard Pihl, <cite>Frames Without Walls: The Domestic Camera, 1960-1995</cite> (Boston: Harrow &amp; Lane, 1996), pp. 112-140.<sup><a class="ref" href="#n2">2</a></sup></p>
    <aside class="note" id="n2" data-voice="editors" data-num="2">
      <p>We have been unable to find this book, its publisher, or Mr. Pihl.</p>
    </aside>
  </aside>
  <p>What he got, according to its admirers, is the most frightening document of the late twentieth century, and according to its detractors, an elaborate hoax.<sup><a class="ref" href="#n3">3</a></sup> The distinction may matter less than either side believes. The first minutes contain nothing but boxes, arguments about where the couch should go, a dog named Hillary and a cat named Mallory sniffing at the new rooms, and two children who have not yet learned to be afraid of a house.</p>
  <aside class="note" id="n3" data-voice="johnny" data-num="3">
    <p>Hoax. I want to say something about that word before we go any further.</p>
    <p>The film doesn’t exist. I checked. So when the old man spends pages arguing about whether a film that doesn’t exist is a fake, you’d think I’d laugh, and I did, the first night, sitting on my kitchen floor with his papers all around me like a kid building a fort. I laughed out loud. The sound went off down the hall of my apartment and came back a little late.</p>
    <p>Anyway. Work. I’m an apprentice at a tattoo shop, which means I sterilize things and trace flash and get yelled at. There’s a dancer who comes in for touch-ups. Everybody calls her Thumper. When she laughs, the whole shop turns toward her like plants toward a window. I’ve been thinking about Thumper instead of sleeping. It beats thinking about the other thing.</p>
  </aside>
  <p>It is worth watching those minutes closely. It is the last time the house is the size it claims to be.</p>
</section>

<section class="chapter" id="ch2" data-title="II. A quarter of an inch">
  <h2 class="ch-head"><span class="ch-num">II</span><span class="ch-title">A quarter of an inch</span></h2>
  <p>The first anomaly is so small that the film nearly misses it.</p>
  <p>The family comes home from a few days away to find a door where there had been none: a plain door in the wall between the master bedroom and the children’s room, opening onto a narrow space like a closet. It is not sinister. It is simply new. Nobody installed it. Nobody can say when it arrived.</p>
  <p>Navidson does what a photographer does with a mystery. He measures it. He measures the inside of the house, then the outside, then the inside again, and then everything once more. The figures do not agree. The house is larger on the inside than on the outside by a quarter of an inch.<sup><a class="ref" href="#n4">4</a></sup></p>
  <aside class="note" id="n4" data-voice="johnny" data-num="4">
    <p>I measured my apartment last night. Every room, wall to wall, with a tape I borrowed from the shop. Then I measured it again. The numbers were fine. Both times, to the sixteenth of an inch, everything was exactly as big as it should be.</p>
    <p>I just want you to know that I got up at four in the morning to do that.</p>
  </aside>
  <p>A quarter of an inch is nothing. It is the thickness of a paperback cover, of a fingernail, of a mistake. That is exactly why Navidson cannot let it go. A house that is a mile larger inside than out is a fairy tale. A house that is a quarter of an inch larger is a problem in carpentry, and problems in carpentry are supposed to have solutions.</p>
  <p>He calls for help. His twin brother Tom comes down to Virginia; the brothers have not been close for years, and Tom, the easygoing one, the one who never became famous for anything, arrives with jokes. So does Billy Reston, an old friend, a professor of engineering at the University of Virginia who has used a wheelchair since an accident on a construction site. Reston brings instruments. The instruments agree with the tape measure. Later measurements find that the gap has grown to five-sixteenths.<sup><a class="ref" href="#n5">5</a></sup></p>
  <aside class="note" id="n5" data-voice="editors" data-num="5">
    <p>The Record gives the discrepancy first as one quarter of an inch and later as five-sixteenths. Both figures are kept here.</p>
  </aside>
  <figure class="self-measure" aria-label="This chapter, measured">
    <dl class="measure measure-small">
      <div><dt>This chapter, from the outside</dt><dd data-chapter-out>2,000 px</dd></div>
      <div><dt>From the inside</dt><dd data-chapter-in>2,000 1&#8260;4 px</dd></div>
    </dl>
  </figure>
  <p>Zampanò devotes many pages to the idea that the smallness is the horror. We can live with the enormous, he argues, because the enormous is always somewhere else. The small discrepancy lives in the bedroom. It sleeps down the hall from the children.</p>
</section>

<section class="chapter" id="ch3" data-title="III. The hallway">
  <h2 class="ch-head"><span class="ch-num">III</span><span class="ch-title">The hallway</span></h2>
  <p>Then, one day, the living room has another door.</p>
  <p>It is a doorway in a wall that should open onto the yard. Beyond it, where the yard should be, a hallway runs away into the dark. Its walls are smooth and ash-gray. There are no windows, no light fixtures, no switches, no molding, no mark of any tool. It is cold inside, a steady cold that has nothing to do with the season. And it is far longer than the house is wide.</p>
  <p>The first footage of it, which circulated on videotape long before the full film, is known as <cite>The Five and a Half Minute Hallway</cite>.<sup><a class="ref" href="#n6">6</a></sup> Much of what people believe about the Record comes from those few minutes: a door that opens onto nowhere, a family standing at its edge, a flashlight beam that finds no end.</p>
  <aside class="note" id="n6" data-voice="zampano" data-num="6">
    <p>The tape was copied and recopied until the hallway was more grain than hallway. Several writers have argued that the degradation is part of its power: the less clearly we see, the more the dark is allowed to do. See Mirela Oszko, “The Poor Image and the Rich Dark,” <cite>Quarterly of the Uncertain Image</cite> 14 (1997): 3-29.</p>
  </aside>

  <p class="band-lines" aria-hidden="true"><span>No fixtures.</span><span>No switches.</span><span>No seams.</span></p>

  <p>Navidson goes in. He is not gone long, but long enough to get lost, and when he comes back out he is not quite the man who went in.<sup><a class="ref" href="#n7">7</a></sup> Karen makes him promise never to go in again. She is claustrophobic and afraid of the dark, and she has already understood something he refuses to: the house is not a subject. It is not going to hold still to be photographed.</p>
  <aside class="note" id="n7" data-voice="johnny" data-num="7">
    <p>Something happened at the shop today.</p>
    <p>I was doing linework on a guy’s shoulder, a koi, nothing difficult, when the room went quiet. Not quiet like people stopped talking. Quiet like the air had been taken out and something bigger put in its place. I could feel it behind me the way you feel a truck pass too close on the freeway. I didn’t turn around. I kept pulling the line.</p>
    <p>When it was over there was a wobble in the koi’s tail you could see from across the room, and the guy was asking if I was okay, and I said sure. I said sure a lot this week.</p>
  </aside>
  <p>One afternoon the dog and the cat wander in. They turn up later outside the house, as if the hallway had let them out somewhere else.</p>
  <p>The cameras keep running. The house keeps being wrong.</p>
</section>

<section class="chapter" id="ch4" data-title="IV. Echoes">
  <h2 class="ch-head"><span class="ch-num">IV</span><span class="ch-title">Echoes</span></h2>
  <p>Zampanò interrupts the story here for a long meditation on echoes, and it is not the digression it appears to be.</p>
  <div class="echoes">
    <p>An echo is the sound of a space answering. Clap your hands in a cathedral and the cathedral tells you how large it is. Clap in a closet and the closet says almost nothing. In the hallway, the explorers call out, and the dark does not answer, or answers late, or answers with something that is not quite their voice.</p>
    <p class="echo" aria-hidden="true"><span>not quite their voice</span><span>their voice</span><span>voice</span></p>
    <p>He reminds us of the nymph Echo, punished by Hera so that she could only repeat the last words spoken to her.<sup><a class="ref" href="#n8">8</a></sup> She fell in love with Narcissus, who loved only his own reflection, and she wasted away until nothing was left of her but the voice.</p>
    <aside class="note" id="n8" data-voice="zampano" data-num="8">
      <p>The fullest ancient telling is Ovid’s, in the third book of the <cite>Metamorphoses</cite>. Echo is punished for talking. Her punishment is to be allowed only the ends of other people’s sentences.<sup><a class="ref" href="#n9">9</a></sup></p>
      <aside class="note" id="n9" data-voice="editors" data-num="9">
        <p>Zampanò’s chapter on echoes is many times longer than the version given here, and ranges across acoustics, architecture and myth. It has been condensed.</p>
      </aside>
    </aside>
    <p class="echo" aria-hidden="true"><span>nothing left of her but the voice</span><span>but the voice</span><span>the voice</span></p>
    <p>An echo, then, is a love that can only answer. It never begins a sentence. It only ends yours.</p>
    <p class="echo" aria-hidden="true"><span>only ends yours</span><span>ends yours</span><span>yours</span></p>
    <p class="echo-last">The house does not answer.</p>
  </div>
</section>

<section class="chapter" id="ch5" data-title="V. Holloway">
  <h2 class="ch-head"><span class="ch-num">V</span><span class="ch-title">Holloway</span></h2>
  <p>Navidson keeps his promise the way people keep promises they resent. He does not go into the hallway himself. He hires someone to go instead.</p>
  <p>Holloway Roberts is a professional hunter and explorer, a man who has built a career on going first. He brings two men who have worked with him for years, Jed Leeder and Kirby Hook, whom everyone calls Wax. They come equipped for cold and dark: cameras, halogen lamps, cold-weather gear, and a radio to stay in touch with Navidson, Tom and Reston at the door.</p>
  <p>A spool of fishing line is tied off at the doorway, and Holloway carries the spool. As long as the line holds, the way back is simple.</p>
  <p>The first explorations find what first explorations always find: more. The hallway branches. There are rooms off it, some the size of closets and some too large for their lamps to cross, all with the same smooth gray walls, none with a single object in them. Every so often, very far off, there is a low sound, like a growl, or like a very large building shifting its weight.<sup><a class="ref" href="#n10">10</a></sup></p>
  <aside class="note" id="n10" data-voice="johnny" data-num="10">
    <p>Lude and I went out last night, the way we used to. Lude collects phone numbers the way other people collect bottle caps: a little proud, a little bored, mostly for the collecting. He’s good at it. I used to be good at it.</p>
    <p>We were in a bar with mirrors on every wall, and somewhere around one in the morning I realized I’d stopped talking to the girl in front of me and was watching the mirrors, all those rooms going back and back, trying to find the one where the reflections stopped. Lude drove me home. He didn’t say anything. That’s the thing about Lude. He knows when not to.</p>
  </aside>
  <p>And then they find the Great Hall, a space so vast that their halogen lamps simply give up, and in it, a spiral staircase going down.</p>


  <p>The explorers are professionals, and what unsettles them is not a danger they can name but the absence of anything at all: no object to find, no mark left by anyone before them, no end to report. Only distance, and the growl, and the line paying out behind them.</p>
</section>

<section class="chapter chapter-maze" id="ch6" data-title="VI. The labyrinth">
  <h2 class="ch-head"><span class="ch-num">VI</span><span class="ch-title">The labyrinth</span></h2>
  <p>Here Zampanò’s text begins to come apart, and so does the page.</p>
  <p>He writes about labyrinths. About Daedalus, who built the labyrinth of Crete so well that he could barely find his own way out of it.<sup><a class="ref" href="#n11">11</a></sup> About King Minos, who hid inside it the creature his queen had borne, half man and half bull, and fed it with young men and women sent from Athens. About Theseus, and the thread Ariadne gave him, which is only fishing line in a more beautiful story.</p>
  <aside class="note" id="n11" data-voice="zampano" data-num="11">
    <p>Ovid again, in the eighth book of the <cite>Metamorphoses</cite>: Daedalus builds his maze so well that he himself can barely find the way back to its entrance.</p>
  </aside>
  <p>In the manuscript, the passages about the minotaur are struck through. They are kept, crossed out and red, which is how they appear here.</p>
  <p class="struck-p"><span class="struck">Perhaps the minotaur was never a monster at all, only a son the king could not bear to be seen with, hidden at the center of a building designed so that no one would ever find him, and no one would ever have to look.</span></p>

  <div class="maze">
    <figure class="inventory" id="inventory">
      <div class="inventory-card">
        <div class="inventory-face inventory-front">
          <p class="inventory-title">Not in the house</p>
          <p>A clock. A calendar. A light switch. A window. A draft under a door. The smell of anybody’s cooking. A spider, or the thread of one. A nail. A stain. A lost glove. A child’s height marked in pencil on a doorframe. A name scratched into anything. A single object that anyone ever left behind.</p>
        </div>
        <div class="inventory-face inventory-back">
          <p class="inventory-title">In the house</p>
          <p>Whoever is holding the light.</p>
        </div>
      </div>
      <button class="turn" type="button" data-turn="inventory" aria-controls="inventory">Turn the leaf</button>
    </figure>

    <div class="maze-cols">
      <p class="maze-col">A maze, Zampanò argues, is a building designed to be experienced from the inside only. From above, from outside, on the map, a labyrinth is merely a pattern, even a pretty one. It becomes a labyrinth when you are in it and cannot see over the walls.</p>
      <div class="upside-wrap">
        <p class="maze-col upside" id="upside">The house on Ash Tree Lane offers no view from above. There is no map. There may be no center. There may be something living in it, or the thing living in it may be the house itself, turning over in its sleep.</p>
        <button class="turn" type="button" data-turn="upside" aria-controls="upside">Turn the book</button>
      </div>
      <p class="margin-scrawl voice-johnny">I can’t read the next part. I’ve tried with the pages turned every way. It’s his hand, and it runs around the edge of the sheet like it’s looking for the exit.<sup><a class="ref" href="#n12">12</a></sup></p>
      <aside class="note" id="n12" data-voice="johnny" data-num="12">
        <p>I should tell you about my mother.</p>
        <p>Her name is Pelafina. She lived for years in a place called the Three Attic Whalestoe Institute, which is a beautiful name for a place with locks on the outside of the doors. I was a kid when she went in. There was a night, and a thing she did, and afterward there were doctors, and then there was the Institute. I’ll tell you about the night some other time. Or I won’t.</p>
        <p>She wrote to me. For years. Long letters, funny letters, letters so crazy the paper looks like it’s sweating. I kept every one.<sup><a class="ref" href="#n13">13</a></sup></p>
        <aside class="note" id="n13" data-voice="editors" data-num="13">
          <p>A selection appears at the end of this edition. See <a href="#letters">The Whalestoe Letters</a>.</p>
        </aside>
    </div>

<section class="chapter" id="ch7" data-title="VII. Exploration #4">
  <h2 class="ch-head"><span class="ch-num">VII</span><span class="ch-title">Exploration #4</span></h2>
  <p>The fourth exploration is meant to last more than a week. Holloway provisions it the way he would provision an expedition into real wilderness: food, water, fuel, spares of everything. He also brings a gun.</p>
  <p>They go down the staircase farther than anyone has gone, leaving caches of supplies along the way for the climb back. Days in, they turn around. They find the caches torn open and scattered. The neon markers they left to find their way have been ripped apart. There is no sign of what did it. There is, as always, nothing in the house but them.</p>
  <div class="narrowing">
    <p style="--w:31em">Holloway will not accept that. He has spent his life tracking animals, and he is certain that something is tracking them. He wants to go on and find it. Jed and Wax want to go home.</p>
    <p style="--w:26em">In the dark, Holloway sees a shape and fires. It is Wax. He is badly wounded, and he lives. Jed gets him away, and Holloway, who has stopped being their leader and started being the thing they are afraid of, follows them.</p>
    <p style="--w:21em">At the door, over the radio, the others hear all of it. Tom goes in and spends days alone in the maze, keeping the radio relay alive so that the voices below can reach the voices above. He rigs a pulley for the wounded. Reston goes in too, wheelchair and all. Navidson goes down to them.</p>
    <p style="--w:16em">They reach Jed and Wax. Holloway reaches them too. Jed does not survive.</p>
    <p style="--w:11em">Wax is carried out alive.</p>
    <p style="--w:7em">Holloway is not.</p>
  </div>

  <figure class="tape" aria-label="Holloway's last tape, described">
    <div class="tape-screen">
      <span class="tape-rec" aria-hidden="true">REC</span>
      <span class="tape-tc" aria-hidden="true">00:00:00:00</span>
      <p class="tape-desc">Hi8, handheld. The only light is his own. He is talking to the dark as if it could hear him. Every few seconds he turns, fast, and the light swings, and there is nothing there, and he keeps talking.</p>
      <span class="tape-dark" aria-hidden="true"></span>
    </div>
    <figcaption>The last tape, described rather than shown.</figcaption>
  </figure>

  <p>His camera is found afterward. On the last tape he is alone, out of supplies and lost, talking to the dark about the creature he is sure is out there. Then he turns the gun on himself. It is not quick. For a few more minutes the camera goes on recording, and at the end, the blackness at the edges of the frame seems to move inward, as if the house were closing over him. Nothing of him is ever brought out.<sup><a class="ref" href="#n14">14</a></sup></p>
  <aside class="note" id="n14" data-voice="johnny" data-num="14">
    <p>Haven’t been to the shop in nine days. They called. Then they called again. Then they stopped calling, which I’m pretty sure is how you get fired when nobody can be bothered to say it.</p>
    <p>I don’t shower much. The water is loud, and you can’t hear anything else while it’s running. I eat when I remember. I sleep with every light on, which is a funny thing to learn about yourself at my age. Lude came by and knocked for a long time, and I sat very still on the kitchen floor until he went away.</p>
  </aside>
</section>

<section class="chapter" id="ch8" data-title="VIII. What the house took">
  <h2 class="ch-head"><span class="ch-num">VIII</span><span class="ch-title">What the house took</span></h2>
  <p>The house does not stay in its hallway.</p>
  <div class="torn">
    <p>After the rescue it begins to change the rooms the family lives in. Doorways open where there were walls. The growl comes up through the floorboards. And then, all at once, the house moves. The gray space tears into the living quarters, floors drop away, rooms stretch and split, and the Navidsons run for their lives through a home that is coming apart around them.</p>
  </div>
  <p class="aftermath">Tom gets Daisy out. He does not get himself out. The house takes him, the way it took Holloway.</p>
  <p>Karen leaves with the children.<sup><a class="ref" href="#n15">15</a></sup> Navidson stays behind with the house, with the footage, and with a grief that has two names. One is Tom. The other is Delial.</p>
  <aside class="note" id="n15" data-voice="johnny" data-num="15">
    <p>I’m leaving L.A. His pages are in a box on the passenger seat, and I buckled the seat belt around the box, which probably tells you everything.</p>
    <p>I’m going to Virginia. I’m going to find Ash Tree Lane.</p>
  </aside>
  <p>For most of the film, nobody knows what Delial means. Navidson writes it, says it, keeps coming back to it. The answer arrives late. Delial is the name he gave to the girl in his Pulitzer photograph: a starving child in Sudan, photographed with a vulture waiting close by. He took the picture. He won the prize. He has carried her into every room he has entered since, and the house, Zampanò suggests, found her there.</p>
</section>

<section class="chapter" id="ch9" data-title="IX. What some have thought">
  <h2 class="ch-head"><span class="ch-num">IX</span><span class="ch-title">What some have thought</span></h2>
  <p>Karen does something no one expects. She makes films.</p>
  <p>Separated from Navidson, far from the house, she takes the footage and begins to cut it herself. She shows it to people whose work is to know things, writers and critics and scholars, some famous and some not, and she films them watching.<sup><a class="ref" href="#n16">16</a></sup> Each of them explains the house in the language of their own trade. Every explanation is fluent, and none of them is enough. She calls it <cite>What Some Have Thought</cite>.</p>
  <aside class="note" id="n16" data-voice="editors" data-num="16">
    <p>The writers and scholars Karen filmed are not named in this retelling, and nothing is put in their mouths. The frames below are a paraphrase of the kinds of answer she collected.</p>
  </aside>
  <div class="strip" role="list" tabindex="0" aria-label="What Some Have Thought, frame by frame">
    <figure class="frame" role="listitem"><p>A novelist says it is about a marriage.</p></figure>
    <figure class="frame" role="listitem"><p>A critic says it is about the camera.</p></figure>
    <figure class="frame" role="listitem"><p>A scientist asks to see the measurements again.</p></figure>
    <figure class="frame" role="listitem"><p>A philosopher says the house is a word.</p></figure>
    <figure class="frame" role="listitem"><p>Someone says it is a fake, and keeps watching.</p></figure>
    <figure class="frame" role="listitem"><p>Karen says nothing. She is looking at Will.</p></figure>
  </div>
  <p>Then she makes a second, much shorter film, out of the footage of Navidson himself: the man at work, the man with the children, the man who could not stop looking at things. It lasts only a few minutes. It is called <cite>A Brief History of Who I Love</cite>. When she finishes it, she understands that she has to go back to Virginia.</p>
</section>

<section class="chapter" id="ch10" data-title="X. Exploration #5">
  <h2 class="ch-head"><span class="ch-num">X</span><span class="ch-title">Exploration #5</span></h2>
  <p>Navidson goes back in alone.</p>
  <p>This time he has promised no one anything. He takes supplies, his cameras, and a book to read. He goes deeper than Holloway went, past every place where the others turned back, until the staircase and the walls and even the floor seem to give out, and he is simply suspended in a dark with no dimensions at all.<sup><a class="ref" href="#n17">17</a></sup></p>
  <aside class="note" id="n17" data-voice="johnny" data-num="17">
    <p>Virginia.</p>
    <p>I’m not going to describe what’s on Ash Tree Lane. I’ve started to write it down four times, and every time the sentences go wrong in the same place. I’ll tell you this much: I stood there for a long time, and I didn’t go in, and I’m not sure there was anywhere to go in to.</p>
    <p>I drove away without looking in the mirror. It’s a skill. I’ve been practicing.</p>
  </aside>
  <p>His supplies run out. His lights die, one after another. What he has left is the book, and something to set it alight.</p>
  <p>So he reads it the only way he can. He tears out a page, burns it, and reads the next page by its light. Page by page, the book becomes light, and then ash. The camera records the title on its cover. It is called <cite>House of Leaves</cite>.</p>


  <p>And then there are no more pages.</p>
</section>

<section class="chapter" id="ch11" data-title="XI. Vermont">
  <h2 class="ch-head"><span class="ch-num">XI</span><span class="ch-title">Vermont</span></h2>
  <p>Karen goes into the house.</p>
  <p>The woman who could not bear a closed room walks into the dark of Ash Tree Lane to look for him. And she finds him, alive, starved, badly frostbitten and hurt, in a place that should have kept him.</p>
  <p>They come out together. They leave Virginia. In Vermont, at last, they marry.</p>
  <p>Zampanò’s study does not end with an explanation, because there is none to give. There is only a family that went into a house larger than itself, and a man who learned, too late and then just in time, that the thing worth documenting had always been the person holding the light.<sup><a class="ref" href="#n18">18</a></sup></p>
  <aside class="note" id="n18" data-voice="johnny" data-num="18">
    <p>Lude’s dead. Motorcycle. They said it was quick, the way people always say it was quick.</p>
    <p>I haven’t stayed anywhere long since. Last week, in a bar in a town I won’t name, a band came on and started to play, and by the second song I understood the songs were about the house. About Navidson and Karen and the stairs. Songs about a book nobody has published, a book that as far as I know is still just paper in a box in my car.</p>
    <p>Afterward I asked them where it came from, and what they told me doesn’t fit anything I know.</p>
    <p>I don’t know what that means yet. Maybe it means it’s out. Maybe it means it was never only mine.</p>
    <p>Tonight I’m sitting under a tree at the edge of a field. It’s cold, but the regular kind of cold. There’s a whole sky over me and it is exactly as big as it looks. I keep telling myself it’s going to be all right, and for once I almost believe me.</p>
  </aside>
</section>

<section class="appendix voice-pelafina" id="letters" data-title="Appendix. The Whalestoe Letters">
  <header class="appendix-head">
    <p class="appendix-kicker">Appendix</p>
    <h2 class="appendix-title">The Whalestoe Letters</h2>
    <p class="appendix-ed voice-editors">Pelafina H. Lièvre wrote to her son for years from the Three Attic Whalestoe Institute, and her letters, in the book, are one of its great hidden rooms. The three below are not hers. They are imagined in her manner, for this retelling. Hers are in the book.</p>
  </header>

  <article class="letter">
    <p class="letter-salute">My dear Johnny,</p>
    <p>The nurses have learned to leave my window open for me by an inch, and through that inch comes everything: pine, rain, the kitchens at noon, the whole of a world I am not presently allowed into.</p>
    <p>You must eat. You must sleep in the dark like a sensible animal and not with every lamp lit. I know you. I know you leave every lamp lit.</p>
    <p>Write to me about school. Write to me about the house you live in now, and whether they are kind to you there. Write to me about anything. I read your letters until the paper wears through at the folds.</p>
    <p class="letter-close">Your loving<br>Mother</p>
  </article>

  <article class="letter letter-coded" id="coded">
    <p class="letter-salute">My dear Johnny,</p>
    <p>I have been reading the old stories again. The one about the maze, and the girl who gave the thread. It is always the girls who give the thread, have you noticed, and the boys who get the credit for coming back.</p>
    <p class="cipher" data-cipher>Wind howls over ice. Still, wardens read in the infirmary, nodding. Grow, young one, unafraid.</p>
    <p>Forgive the odd sentence. They give us such pills.</p>
    <p class="letter-close">Your loving<br>Mother</p>
    <button class="turn" type="button" data-decode aria-controls="coded">Read the first letters</button>
    <p class="decoded" data-decoded aria-live="polite" hidden></p>
  </article>

  <article class="letter letter-late">
    <p class="letter-salute">Johnny,</p>
    <p>they tell me you do not want my letters. They tell me a great many things. I will write anyway, the way the sea writes on the beach, over and over, and no one asks it to.</p>
    <p>I love you. I did the thing I did. Both are true. I have stopped expecting to be forgiven for the second, and I will never stop insisting on the first.</p>
    <p class="letter-close">P.</p>
  </article>
</section>
